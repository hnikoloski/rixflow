<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="rixflow setup">
<title>rixflow setup</title>
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect x="10" y="6" width="980" height="666" rx="12" fill="#16161d" stroke="#2c2b36" filter="url(#shadow)"/>
<path d="M10 18a12 12 0 0 1 12-12h956a12 12 0 0 1 12 12v22H10z" fill="#22222b"/>
<circle cx="32" cy="23" r="6" fill="#ff5f57"/><circle cx="52" cy="23" r="6" fill="#febc2e"/><circle cx="72" cy="23" r="6" fill="#28c840"/>
<text x="500" y="28" fill="#8d8a99" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" text-anchor="middle">rixflow setup</text>
<g font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">
<text x="30" y="70" fill="#4eba65" font-weight="700" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$</text>
<text x="46.2" y="70" fill="#e6e4df" textLength="259.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">node …/rixflow/dist/hub.cjs init</text>
<text x="30" y="110" fill="#e6e4df" font-weight="700" textLength="348.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Join an existing team, or create a new one?</text>
<text x="46.2" y="130" fill="#8d8a99" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1)</text>
<text x="70.5" y="130" fill="#e6e4df" textLength="170.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Join an existing team</text>
<text x="46.2" y="150" fill="#d97757" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2)</text>
<text x="70.5" y="150" fill="#d97757" font-weight="700" textLength="137.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Create a new team</text>
<text x="30" y="170" fill="#8d8a99" textLength="89.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Choose 1-2:</text>
<text x="127.19999999999999" y="170" fill="#4eba65" font-weight="700" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2</text>
<text x="30" y="210" fill="#e6e4df" font-weight="700" textLength="307.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Which ticket system does the team use?</text>
<text x="46.2" y="230" fill="#8d8a99" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1)</text>
<text x="70.5" y="230" fill="#e6e4df" textLength="40.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Asana</text>
<text x="46.2" y="250" fill="#d97757" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2)</text>
<text x="70.5" y="250" fill="#d97757" font-weight="700" textLength="388.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Jira Cloud (an address ending in .atlassian.net)</text>
<text x="46.2" y="270" fill="#8d8a99" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3)</text>
<text x="70.5" y="270" fill="#e6e4df" textLength="299.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Jira on your own server (self-hosted)</text>
<text x="30" y="290" fill="#8d8a99" textLength="89.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Choose 1-3:</text>
<text x="127.19999999999999" y="290" fill="#4eba65" font-weight="700" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2</text>
<text x="30" y="310" fill="#8d8a99" textLength="380.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Jira address (e.g. https://acme.atlassian.net):</text>
<text x="418.79999999999995" y="310" fill="#4eba65" font-weight="700" textLength="210.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">https://acme.atlassian.net</text>
<text x="30" y="330" fill="#8d8a99" textLength="178.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Your Jira login email:</text>
<text x="216.29999999999998" y="330" fill="#4eba65" font-weight="700" textLength="137.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">alice@example.com</text>
<text x="30" y="350" fill="#8d8a99" textLength="243.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Jira API token (input masked):</text>
<text x="281.1" y="350" fill="#4eba65" font-weight="700" textLength="194.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">************************</text>
<text x="30" y="370" fill="#4eba65" font-weight="700" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✓</text>
<text x="46.2" y="370" fill="#8d8a99" textLength="283.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Jira token stored in your keychain.</text>
<text x="30" y="394" fill="#5c5a68" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⋮</text>
<text x="30" y="418" fill="#e6e4df" font-weight="700" textLength="307.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Some tickets as RixFlow will see them:</text>
<text x="46.2" y="438" fill="#8d8a99" font-weight="700" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Ticket   Title                          Project  Status       Sprint  Urgent</text>
<text x="46.2" y="458" fill="#8d8a99" textLength="56.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">WEB-142</text>
<text x="119.1" y="458" fill="#e6e4df" textLength="234.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Checkout: fix coupon rounding</text>
<text x="370.2" y="458" fill="#d97757" font-weight="700" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">AC</text>
<text x="443.09999999999997" y="458" fill="#4eba65" textLength="89.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">in progress</text>
<text x="548.4" y="458" fill="#e6e4df" textLength="24.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">yes</text>
<text x="613.1999999999999" y="458" fill="#e6e4df" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">no</text>
<text x="46.2" y="478" fill="#8d8a99" textLength="56.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">WEB-160</text>
<text x="119.1" y="478" fill="#e6e4df" textLength="202.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Hotfix: tax on gift cards</text>
<text x="370.2" y="478" fill="#d97757" font-weight="700" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">AC</text>
<text x="443.09999999999997" y="478" fill="#4eba65" textLength="89.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">in progress</text>
<text x="548.4" y="478" fill="#e6e4df" textLength="24.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">yes</text>
<text x="613.1999999999999" y="478" fill="#ffc107" textLength="24.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">yes</text>
<text x="46.2" y="498" fill="#8d8a99" textLength="56.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">WEB-151</text>
<text x="119.1" y="498" fill="#e6e4df" textLength="178.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Cart drawer focus trap</text>
<text x="370.2" y="498" fill="#d97757" font-weight="700" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">AC</text>
<text x="443.09999999999997" y="498" fill="#e6e4df" textLength="40.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">to do</text>
<text x="548.4" y="498" fill="#e6e4df" textLength="24.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">yes</text>
<text x="613.1999999999999" y="498" fill="#e6e4df" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">no</text>
<text x="46.2" y="518" fill="#8d8a99" textLength="48.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">GLX-93</text>
<text x="119.1" y="518" fill="#e6e4df" textLength="186.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Footer links 404 on /de</text>
<text x="370.2" y="518" fill="#d97757" font-weight="700" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">GL</text>
<text x="443.09999999999997" y="518" fill="#e6e4df" textLength="40.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">to do</text>
<text x="548.4" y="518" fill="#e6e4df" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">no</text>
<text x="613.1999999999999" y="518" fill="#e6e4df" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">no</text>
<text x="30" y="550" fill="#e6e4df" font-weight="700" textLength="113.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Is this right?</text>
<text x="46.2" y="570" fill="#d97757" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1)</text>
<text x="70.5" y="570" fill="#d97757" font-weight="700" textLength="178.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Yes, keep this mapping</text>
<text x="46.2" y="590" fill="#8d8a99" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2)</text>
<text x="70.5" y="590" fill="#e6e4df" textLength="315.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Go back: how a ticket names its project</text>
<text x="46.2" y="610" fill="#5c5a68" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">…</text>
<text x="30" y="630" fill="#8d8a99" textLength="89.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Choose 1-6:</text>
<text x="127.19999999999999" y="630" fill="#4eba65" font-weight="700" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1</text>
</g>
</svg>
